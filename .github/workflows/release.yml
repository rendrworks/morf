name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "mold-linux-amd64"
          - os: ubuntu-24.04-arm
            artifact: "mold-linux-arm64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build
        run: cargo build --release --bin mold
      - name: Package
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C target/release mold
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz

